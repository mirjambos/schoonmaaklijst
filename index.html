<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schoonmaaklijst</title>
<style>
  :root {
    --brown: #2D2827;
    --pink: #E0A2A2;
    --pink-dark: #c98080;
    --light: #FBF6F6;
    --gray: #8a8382;
    --red: #b5504a;
    --border: #e8dede;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, "Open Sans", sans-serif; background: var(--light); color: var(--brown); }
  header { background: var(--brown); color: var(--light); padding: 18px 16px; display: flex; justify-content: space-between; align-items: flex-start; }
  header .titles h1 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; }
  header .titles p { margin: 0; font-size: 13px; color: var(--pink); }
  #admin-toggle { background: transparent; border: 1px solid var(--pink); color: var(--pink); border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #admin-toggle.on { background: var(--pink); color: var(--brown); }
  .tabs { display: flex; background: #fff; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .tab { flex: 1; padding: 14px; text-align: center; font-weight: 700; font-size: 14px; color: var(--gray); cursor: pointer; border-bottom: 3px solid transparent; }
  .tab.active { color: var(--brown); border-bottom: 3px solid var(--pink); }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  .view.active { display: block; }
  .group { margin-bottom: 18px; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .group-header { padding: 10px 14px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; background: #f6ecec; color: var(--brown); display: flex; justify-content: space-between; align-items: center; }
  .group-header .freq-note { font-size: 11px; font-weight: 400; text-transform: none; color: var(--gray); }
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--border); }
  .task.due { background: #fdf5f0; }
  .task input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--pink-dark); flex-shrink: 0; }
  .task label { flex: 1; font-size: 14.5px; line-height: 1.4; }
  .task .last-done { display: block; font-size: 11px; color: var(--gray); margin-top: 2px; }
  .due-badge { font-size: 10px; font-weight: 700; background: var(--pink-dark); color: #fff; padding: 2px 6px; border-radius: 8px; margin-left: 6px; white-space: nowrap; }
  .missed-badge { font-size: 10px; font-weight: 700; background: var(--red); color: #fff; padding: 2px 6px; border-radius: 8px; margin-left: 6px; white-space: nowrap; }
  .move-select { margin-top: 6px; font-size: 12px; padding: 4px; border: 1px solid var(--border); border-radius: 5px; }
  .signoff { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 20px; }
  .signoff h3 { margin: 0 0 10px 0; font-size: 15px; }
  .signoff input, .signoff textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 14px; margin-bottom: 10px; }
  .signoff textarea { min-height: 70px; resize: vertical; }
  button.primary { width: 100%; padding: 14px; background: var(--brown); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button.primary:disabled { background: #ccc; cursor: not-allowed; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--brown); color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; text-align: center; z-index: 100;}
  .toast.show { opacity: 1; }
  .history { margin-top: 20px; }
  .history h3 { font-size: 14px; color: var(--gray); margin-bottom: 8px; }
  .history-item { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .history-item .h-top { display: flex; justify-content: space-between; font-weight: 700; }
  .history-item .h-done-list { margin: 6px 0 0 0; padding-left: 18px; }
  .history-item .h-done-list li { margin-bottom: 2px; }

  .timer-box { display: flex; align-items: center; justify-content: space-between; background: #f6ecec; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
  .timer-display { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer-btns button { border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; margin-left: 6px; }
  .timer-btns .start-btn { background: var(--brown); color: #fff; }
  .timer-btns .pause-btn { background: var(--pink-dark); color: #fff; }
  .timer-btns .stop-btn { background: var(--red); color: #fff; }
  .history-item .h-comment { margin-top: 4px; color: var(--gray); font-style: italic; }

  .admin-add-task { background: #fff; border: 1px dashed var(--pink-dark); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .admin-add-title { font-size: 12px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 8px; }
  .admin-add-task input[type="text"] { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
  .admin-add-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .admin-add-row select { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .admin-add-row button { background: var(--brown); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .reset-link { background: none; border: none; color: var(--gray); font-size: 11px; text-decoration: underline; cursor: pointer; padding: 0; }
  .admin-task-actions { display: flex; gap: 6px; margin-left: 6px; flex-shrink: 0; }
  .admin-task-actions button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px; font-size: 12px; cursor: pointer; line-height: 1; }

  .once-library { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
  .once-lib-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .once-lib-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--pink-dark); flex-shrink: 0; }
  .once-lib-item span { flex: 1; }
  .once-lib-item button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; font-size: 11px; cursor: pointer; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <div class="titles">
    <h1>Schoonmaaklijst</h1>
    <p id="date-label">Laden...</p>
    <p id="sync-status" style="margin:2px 0 0 0;font-size:11px;"></p>
  </div>
  <button id="admin-toggle" onclick="toggleAdmin()">Beheer</button>
</header>

<div class="tabs">
  <div class="tab active" data-tab="huis">Huis</div>

</div>

<div class="container">

  <div id="kantoor-view" class="view"></div>
</div>

<div id="toast" class="toast"></div>

// toevoegingen/verwijderingen uit Beheer worden er los van bewaard (zie tasks_<locatie>

    { id: "h-badkamer", text: "Badkamer: wc, wastafel, douche/bad reinigen (glazen douchewand) en prullenbak legen", group: "w" },

    { id: "h-houten-delen", text: "Houten liggende delen aan deur woonkamer afstoffen", group: "m" },
    { id: "h-douche-ontkalken", text: "Glazen douchewand badkamer: grondig ontkalken", group: "m" },
    { id: "h-radiatoren", text: "Radiatoren", group: "q" },
    { id: "h-ramen-buiten", text: "Ramen buitenzijde (indien niet door glazenwasser gedaan)", group: "q" }
  ],
  kantoor: [
    { id: "k-wc", text: "Wc: reinigen en prullenbak legen", group: "w" },
    { id: "k-prullenbak", text: "Prullenbak(ken) bureaus/algemeen legen", group: "w" },
    { id: "k-bureaus", text: "Bureaus afnemen", group: "w" },
    { id: "k-vloer", text: "Vloer stofzuigen/dweilen", group: "w" },
    { id: "k-keukenblokje-aanrecht", text: "Keukenblokje: aanrecht afnemen", group: "w" },
    { id: "k-ramen-binnen", text: "Ramen binnenzijde", group: "2w" },
    { id: "k-deurklinken", text: "Deurklinken en schakelaars", group: "2w" },
    { id: "k-schermen", text: "Beeldschermen en toetsenborden droog stofvrij maken", group: "2w" },
    { id: "k-vergaderkamer-vensterbank", text: "Vergaderkamer: vensterbank op de grond afstoffen", group: "2w" },
    { id: "k-keukenblokje-buiten", text: "Keukenblokje: kastjes buitenkant afnemen", group: "m" },
    { id: "k-kasten", text: "Kasten en dossierkasten buitenzijde afnemen", group: "m" },
    { id: "k-onder-bureaus", text: "Onder/achter bureaus en meubels", group: "m" },
    { id: "k-stopcontacten", text: "Stopcontacten en kabelgoten afstoffen", group: "m" },
    { id: "k-planten", text: "Planten verzorgen en blad afnemen", group: "m" },
    { id: "k-keukenblokje-binnen", text: "Keukenblokje: kastjes binnenkant leegmaken en reinigen", group: "q" },
    { id: "k-gordijnen", text: "Gordijnen/lamellen", group: "q" },
    { id: "k-radiatoren", text: "Radiatoren", group: "q" },
    { id: "k-bekleding", text: "Bekleding meubels / vloerbedekking grondig afnemen", group: "q" }
  ]
};

let state = {};        // taskId -> { lastDone: 'YYYY-MM-DD' }
let history = [];      // array of records
let checkedThisSession = { huis: {}, kantoor: {} };
let adminMode = false;
let timerIntervals = { huis: null, kantoor: null };
let finishedDurations = { huis: null, kantoor: null };

// -- Opslag: gewone browser localStorage. Werkt overal (ook op een statische
// GitHub Pages-site), in tegenstelling tot de eerder gebruikte window.storage-API
// die alleen binnen Claude's eigen omgeving bestaat.
const LS_PREFIX = "schoonmaak_";
function lsGet(key) {
  try { return localStorage.getItem(LS_PREFIX + key); } catch (e) { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, value); } catch (e) { console.error(e); }
}
function lsDelete(key) {
  try { localStorage.removeItem(LS_PREFIX + key); } catch (e) { console.error(e); }
}

function cloneTasks(arr) { return arr.map(t => ({ ...t })); }

// Geeft de actuele werkzaamhedenlijst voor een locatie terug: de bewaarde eigen
// versie (na bewerken/toevoegen/verwijderen) als die bestaat, anders de standaardlijst.
function getEffectiveTasks(location) {
  const raw = lsGet("tasks_" + location);
  if (raw) {
    try { return JSON.parse(raw); } catch (e) {}
  }
  return cloneTasks(TASK_DEFS[location]);
}
function saveEffectiveTasks(location, tasks) {
  lsSet("tasks_" + location, JSON.stringify(tasks));
  if (fbRoot) { fbRoot.child('tasks_' + location).set(tasks).catch(e => console.error(e)); }
}
function resetTasks(location) {
  const label = location === "huis" ? "Huis" : "Kantoor";
  if (!window.confirm('Standaardlijst herstellen voor ' + label + '? Eigen aanpassingen en toevoegingen gaan dan verloren.')) return;
  lsDelete("tasks_" + location);
  if (fbRoot) { fbRoot.child('tasks_' + location).remove().catch(e => console.error(e)); }
  renderView(location);
  showToast('Standaardlijst hersteld voor ' + label + '.');
}

function addTask(location) {
  const textInput = document.getElementById(location + '-new-task-text');
  const groupSelect = document.getElementById(location + '-new-task-group');
  const text = textInput.value.trim();
  if (!text) { showToast('Vul eerst een omschrijving in.'); return; }
  const tasks = getEffectiveTasks(location);
  const id = 'custom-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  tasks.push({ id, text, group: groupSelect.value });
  saveEffectiveTasks(location, tasks);
  renderView(location);
  showToast('Werkzaamheid toegevoegd.');
}

function editTaskText(location, taskId) {
  const tasks = getEffectiveTasks(location);
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  const newText = window.prompt('Werkzaamheid aanpassen:', task.text);
  if (newText === null) return;
  const trimmed = newText.trim();
  if (!trimmed) { showToast('Werkzaamheid mag niet leeg zijn.'); return; }
  task.text = trimmed;
  saveEffectiveTasks(location, tasks);
  renderView(location);
  showToast('Werkzaamheid aangepast.');
}

function deleteTask(location, taskId) {
  const tasks = getEffectiveTasks(location);
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  if (!window.confirm('Werkzaamheid verwijderen: "' + task.text + '"?')) return;
  saveEffectiveTasks(location, tasks.filter(t => t.id !== taskId));
  renderView(location);
  showToast('Werkzaamheid verwijderd.');
}

function formatDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
}

// Timerstand per locatie: { startedAt: ISOtijd van het huidige lopende stukje (of null
// als gepauzeerd/gestopt), accumulated: eerder opgebouwde seconden uit vorige stukjes }.
// Zo telt Pauze -> Hervatten gewoon door i.p.v. weer bij 0 te beginnen.
async function getTimerData(location) {
  const raw = lsGet('timer_' + location);
  if (!raw) return { startedAt: null, accumulated: 0 };
  try {
    const d = JSON.parse(raw);
    return { startedAt: d.startedAt || null, accumulated: d.accumulated || 0 };
  } catch (e) { return { startedAt: null, accumulated: 0 }; }
}
async function setTimerData(location, data) {
  if (!data.startedAt && !data.accumulated) {
    lsDelete('timer_' + location);
    if (fbRoot) { try { await fbRoot.child('timer_' + location).remove(); } catch (e) { console.error(e); } }
  } else {
    lsSet('timer_' + location, JSON.stringify(data));
    if (fbRoot) { try { await fbRoot.child('timer_' + location).set(data); } catch (e) { console.error(e); } }
  }
}

async function startTimer(location) {
  const data = await getTimerData(location);
  data.startedAt = new Date().toISOString();
  await setTimerData(location, data);
  finishedDurations[location] = null;
  await refreshTimerDisplay(location);
}

async function pauseTimer(location) {
  const data = await getTimerData(location);
  if (data.startedAt) {
    data.accumulated = (data.accumulated || 0) + Math.round((new Date() - new Date(data.startedAt)) / 1000);
    data.startedAt = null;
  }
  await setTimerData(location, data);
  await refreshTimerDisplay(location);
}

async function stopTimer(location) {
  const data = await getTimerData(location);
  let total = data.accumulated || 0;
  if (data.startedAt) {
    total += Math.round((new Date() - new Date(data.startedAt)) / 1000);
  }
  finishedDurations[location] = total;
  await setTimerData(location, { startedAt: null, accumulated: 0 });
  if (timerIntervals[location]) { clearInterval(timerIntervals[location]); timerIntervals[location] = null; }
  await refreshTimerDisplay(location);
}

async function refreshTimerDisplay(location) {
  const display = document.getElementById(location + '-timer-display');
  const startBtn = document.getElementById(location + '-start-btn');
  const pauseBtn = document.getElementById(location + '-pause-btn');
  const resumeBtn = document.getElementById(location + '-resume-btn');
  const stopBtn = document.getElementById(location + '-stop-btn');
  if (!display) return;
  if (timerIntervals[location]) { clearInterval(timerIntervals[location]); timerIntervals[location] = null; }

  const data = await getTimerData(location);
  const isRunning = !!data.startedAt;
  const isPaused = !isRunning && (data.accumulated || 0) > 0;

  startBtn.style.display = (!isRunning && !isPaused) ? 'inline-block' : 'none';
  pauseBtn.style.display = isRunning ? 'inline-block' : 'none';
  resumeBtn.style.display = isPaused ? 'inline-block' : 'none';
  stopBtn.style.display = (isRunning || isPaused) ? 'inline-block' : 'none';

  if (isRunning) {
    const tick = () => {
      const elapsed = (data.accumulated || 0) + Math.round((new Date() - new Date(data.startedAt)) / 1000);
      display.textContent = formatDuration(elapsed);
    };
    tick();
    timerIntervals[location] = setInterval(tick, 1000);
  } else if (isPaused) {
    display.textContent = formatDuration(data.accumulated);
  } else {
    display.textContent = finishedDurations[location] ? formatDuration(finishedDurations[location]) : '00:00:00';
  }
}

// Lokale datum als YYYY-MM-DD. Bewust NIET via toISOString().slice(0,10) -- dat rekent
// om naar UTC en kan rond middernacht een dag verschuiven (bv. 00:30 's nachts in
// Nederlandse zomertijd is dan nog "gisteren" in UTC).
function localISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function todayStr() { return localISO(new Date()); }
function daysSince(dateStr) {
  if (!dateStr) return Infinity;
  return Math.round((new Date(todayStr()) - new Date(dateStr)) / 86400000);
}
function formatDateNL(dateStr) {
  if (!dateStr) return "nog nooit gedaan";
  return new Date(dateStr).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
// Voor gebruik in een enkel-aangehaalde JS-stringliteral binnen een dubbel-aangehaald
// HTML-attribuut (bv. onclick="fn('...')") -- anders breekt een apostrof in de
// werkzaamheidstekst de hele handler stilletjes af.
function jsStr(str) {
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

// Eenmalige taken: verdwijnen na afvinken (geen terugkerende frequentie/laatst-gedaan),
// maar blijven als tekst bewaard in een "bibliotheek" zodat ze later opnieuw geactiveerd
// kunnen worden zonder ze opnieuw te hoeven intypen.
function getOneTimeLibrary(location) {
  const raw = lsGet('oneTimeLibrary_' + location);
  if (!raw) return [];
  try { return JSON.parse(raw); } catch (e) { return []; }
}
function saveOneTimeLibrary(location, list) {
  lsSet('oneTimeLibrary_' + location, JSON.stringify(list));
  if (fbRoot) { fbRoot.child('oneTimeLibrary_' + location).set(list).catch(e => console.error(e)); }
}
function getActiveOneTime(location) {
  const raw = lsGet('oneTimeActive_' + location);
  if (!raw) return [];
  try { return JSON.parse(raw); } catch (e) { return []; }
}
function saveActiveOneTime(location, list) {
  lsSet('oneTimeActive_' + location, JSON.stringify(list));
  if (fbRoot) { fbRoot.child('oneTimeActive_' + location).set(list).catch(e => console.error(e)); }
}

function addOneTimeLibraryItem(location) {
  const input = document.getElementById(location + '-new-once-text');
  const text = input.value.trim();
  if (!text) { showToast('Vul eerst een omschrijving in.'); return; }
  const library = getOneTimeLibrary(location);
  if (!library.includes(text)) { library.push(text); saveOneTimeLibrary(location, library); }
  const active = getActiveOneTime(location);
  if (!active.some(t => t.text === text)) {
    const id = 'once-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    active.push({ id, text });
    saveActiveOneTime(location, active);
  }
  input.value = '';
  renderView(location);
  showToast('Eenmalige taak toegevoegd.');
}

function toggleOneTimeActive(location, text, isChecked) {
  const active = getActiveOneTime(location);
  if (isChecked) {
    if (!active.some(t => t.text === text)) {
      const id = 'once-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      active.push({ id, text });
      saveActiveOneTime(location, active);
    }
  } else {
    saveActiveOneTime(location, active.filter(t => t.text !== text));
  }
  renderView(location);
}

function deleteOneTimeLibraryItem(location, text) {
  if (!window.confirm('Dit item permanent verwijderen uit de bibliotheek: "' + text + '"?')) return;
  saveOneTimeLibrary(location, getOneTimeLibrary(location).filter(t => t !== text));
  saveActiveOneTime(location, getActiveOneTime(location).filter(t => t.text !== text));
  renderView(location);
  showToast('Verwijderd uit bibliotheek.');
}

async function loadAll() {
  // Snelle eerste render vanuit de lokale cache, terwijl Firebase (indien beschikbaar) nog laadt.
  try { const raw = lsGet('tasks_state'); state = raw ? JSON.parse(raw) : {}; } catch (e) { state = {}; }
  try { const raw = lsGet('signoff_history'); history = raw ? JSON.parse(raw) : []; } catch (e) { history = []; }

  if (!fbRoot) { setSyncStatus('Alleen lokaal (geen Firebase-verbinding)', false); return; }

  firebase.database().ref('.info/connected').on('value', (snap) => {
    setSyncStatus(snap.val() === true ? 'Gesynchroniseerd' : 'Verbinden…', snap.val() === true);
  });

  // Eén gedeelde listener op de hele boom: zodra er ergens iets verandert (op dit
  // apparaat of een ander, bv. Fenna's telefoon), komt de verse data hier binnen en
  // wordt alles herbouwd -- zo zien alle apparaten altijd hetzelfde.
  fbRoot.on('value', (snapshot) => {
    const data = snapshot.val() || {};
    state = data.state || {};
    history = data.history ? Object.keys(data.history).sort().map(k => data.history[k]) : [];

    lsSet('tasks_state', JSON.stringify(state));
    lsSet('signoff_history', JSON.stringify(history));
    ['huis', 'kantoor'].forEach(loc => {
      if (data['tasks_' + loc]) { lsSet('tasks_' + loc, JSON.stringify(data['tasks_' + loc])); }
      else { lsDelete('tasks_' + loc); }
      if (data['timer_' + loc]) { lsSet('timer_' + loc, JSON.stringify(data['timer_' + loc])); }
      else { lsDelete('timer_' + loc); }
      if (data['oneTimeLibrary_' + loc]) { lsSet('oneTimeLibrary_' + loc, JSON.stringify(data['oneTimeLibrary_' + loc])); }
      else { lsDelete('oneTimeLibrary_' + loc); }
      if (data['oneTimeActive_' + loc]) { lsSet('oneTimeActive_' + loc, JSON.stringify(data['oneTimeActive_' + loc])); }
      else { lsDelete('oneTimeActive_' + loc); }
    });

    renderView('huis');
    renderView('kantoor');
  }, (err) => {
    console.error('Firebase-listener fout, val terug op lokale opslag.', err);
    setSyncStatus('Alleen lokaal (verbinding mislukt)', false);
  });
}
async function saveState() {
  lsSet('tasks_state', JSON.stringify(state));
  if (fbRoot) { try { await fbRoot.child('state').set(state); } catch (e) { console.error(e); } }
}
async function saveHistory(newEntry) {
  lsSet('signoff_history', JSON.stringify(history));
  if (fbRoot && newEntry) { try { await fbRoot.child('history').push(newEntry); } catch (e) { console.error(e); } }
}

function toggleAdmin() {
  adminMode = !adminMode;
  document.getElementById('admin-toggle').classList.toggle('on', adminMode);
  renderView('huis');
  renderView('kantoor');
}

function moveTask(location, taskId, newGroup) {
  const tasks = getEffectiveTasks(location);
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  task.group = newGroup;
  saveEffectiveTasks(location, tasks);
  renderView(location);
}

function renderView(location) {
  const tasks = getEffectiveTasks(location);
  const container = document.getElementById(location + '-view');
  let html = '';

  if (adminMode) {
    html += `
      <div class="admin-add-task">
        <div class="admin-add-title">Nieuwe werkzaamheid toevoegen</div>
        <input type="text" id="${location}-new-task-text" placeholder="Omschrijving van de werkzaamheid...">
        <div class="admin-add-row">
          <select id="${location}-new-task-group">
            ${GROUP_ORDER.map(g => `<option value="${g}">${GROUP_META[g].title}</option>`).join('')}
          </select>
          <button type="button" onclick="addTask('${location}')">+ Toevoegen</button>
        </div>
        <button type="button" class="reset-link" onclick="resetTasks('${location}')">Standaardlijst herstellen</button>
      </div>`;

    const onceLibrary = getOneTimeLibrary(location);
    const onceActiveTexts = getActiveOneTime(location).map(t => t.text);
    html += `
      <div class="admin-add-task">
        <div class="admin-add-title">Eenmalige taken</div>
        <input type="text" id="${location}-new-once-text" placeholder="Nieuwe eenmalige taak (bv. filters afzuigkap reinigen)...">
        <div class="admin-add-row">
          <button type="button" onclick="addOneTimeLibraryItem('${location}')" style="flex:1;">+ Toevoegen &amp; op de lijst zetten</button>
        </div>
        ${onceLibrary.length ? `<div class="once-library">` + onceLibrary.map(text => `
          <div class="once-lib-item">
            <input type="checkbox" ${onceActiveTexts.includes(text) ? 'checked' : ''} onchange="toggleOneTimeActive('${location}','${jsStr(text)}', this.checked)">
            <span>${escapeHtml(text)}</span>
            <button type="button" onclick="deleteOneTimeLibraryItem('${location}','${jsStr(text)}')">&#128465;</button>
          </div>`).join('') + `</div>` : '<div style="font-size:12px;color:var(--gray);">Nog geen eenmalige taken bekend.</div>'}
      </div>`;
  }

  const activeOnce = getActiveOneTime(location);
  if (activeOnce.length > 0) {
    html += `<div class="group"><div class="group-header"><span>Eenmalig</span><span class="freq-note">verdwijnt na afvinken</span></div>`;
    activeOnce.forEach(task => {
      const checked = checkedThisSession[location][task.id] ? 'checked' : '';
      html += `
        <div class="task">
          <input type="checkbox" id="${task.id}" ${checked} onchange="toggleTask('${location}','${task.id}')">
          <label for="${task.id}">${escapeHtml(task.text)}</label>
        </div>`;
    });
    html += `</div>`;
  }

  GROUP_ORDER.forEach(groupId => {
    const meta = GROUP_META[groupId];
    const groupTasks = tasks.filter(t => t.group === groupId);
    if (groupTasks.length === 0) return;
    html += `<div class="group"><div class="group-header"><span>${meta.title}</span><span class="freq-note">elke ${meta.days === 7 ? 'week' : meta.days + ' dagen'}</span></div>`;
    groupTasks.forEach(task => {
      const last = state[task.id] ? state[task.id].lastDone : null;
      const dSince = daysSince(last);
      const isDue = dSince >= meta.days;
      const isMissed = last !== null && dSince >= meta.days * 2;
      const checked = checkedThisSession[location][task.id] ? 'checked' : '';
      html += `
        <div class="task ${isDue ? 'due' : ''}">
          <input type="checkbox" id="${task.id}" ${checked} onchange="toggleTask('${location}','${task.id}')">
          <label for="${task.id}">
            ${escapeHtml(task.text)} ${isMissed ? '<span class="missed-badge">VORIGE KEER GEMIST</span>' : (isDue ? '<span class="due-badge">TE DOEN</span>' : '')}
            <span class="last-done">Laatst gedaan: ${formatDateNL(last)}</span>
            ${adminMode ? `
              <select class="move-select" onchange="moveTask('${location}','${task.id}', this.value)">
                ${GROUP_ORDER.map(g => `<option value="${g}" ${g === groupId ? 'selected' : ''}>${GROUP_META[g].title}</option>`).join('')}
              </select>` : ''}
          </label>
          ${adminMode ? `
            <div class="admin-task-actions">
              <button type="button" title="Werkzaamheid bewerken" onclick="editTaskText('${location}','${task.id}')">&#9998;</button>
              <button type="button" title="Werkzaamheid verwijderen" onclick="deleteTask('${location}','${task.id}')">&#128465;</button>
            </div>` : ''}
        </div>`;
    });
    html += `</div>`;
  });

  html += `
    <div class="signoff">
      <h3>Tijd bijhouden</h3>
      <div class="timer-box">
        <span class="timer-display" id="${location}-timer-display">00:00:00</span>
        <span class="timer-btns">
          <button class="start-btn" id="${location}-start-btn" onclick="startTimer('${location}')">Start</button>
          <button class="pause-btn" id="${location}-pause-btn" onclick="pauseTimer('${location}')" style="display:none;">Pauze</button>
          <button class="start-btn" id="${location}-resume-btn" onclick="startTimer('${location}')" style="display:none;">Hervatten</button>
          <button class="stop-btn" id="${location}-stop-btn" onclick="stopTimer('${location}')" style="display:none;">Stop</button>
        </span>
      </div>
      <h3>Aftekenen voor vandaag</h3>
      <textarea id="${location}-comments" placeholder="Opmerkingen (optioneel) — bijv. iets kapot, geen tijd voor iets, extra gedaan..."></textarea>
      <button class="primary" onclick="signOff('${location}')">Aftekenen &amp; opslaan</button>
    </div>
    <div class="history">
      <h3>Weekrapport — ${location === 'huis' ? 'Huis' : 'Kantoor'}</h3>
      <div id="${location}-weekreport"></div>
    </div>
    <div class="history">
      <h3>Recente afmeldingen — ${location === 'huis' ? 'Huis' : 'Kantoor'}</h3>
      <div id="${location}-history"></div>
    </div>
  `;
  container.innerHTML = html;
  renderWeekReport(location);
  renderHistory(location);
  refreshTimerDisplay(location);
}

// Maandag van de week waarin dateStr valt (YYYY-MM-DD), als sleutel om per week te groeperen.
function getWeekStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay(); // 0 = zondag
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diffToMonday);
  return localISO(d);
}
function formatWeekRangeNL(weekStartStr) {
  const start = new Date(weekStartStr + 'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const fmt = (d) => d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  return fmt(start) + ' – ' + fmt(end) + ' ' + end.getFullYear();
}

function renderWeekReport(location) {
  const el = document.getElementById(location + '-weekreport');
  if (!el) return;
  const entries = history.filter(h => h.location === location);
  if (entries.length === 0) { el.innerHTML = '<div class="history-item">Nog geen gegevens.</div>'; return; }

  const weeks = {};
  entries.forEach(e => {
    const wk = getWeekStart(e.date);
    if (!weeks[wk]) weeks[wk] = { count: 0, duration: 0, days: 0, hasDuration: false };
    weeks[wk].count += e.count;
    if (e.duration) { weeks[wk].duration += e.duration; weeks[wk].hasDuration = true; }
    weeks[wk].days += 1;
  });

  const weekKeys = Object.keys(weeks).sort().reverse().slice(0, 12);
  el.innerHTML = weekKeys.map(wk => {
    const w = weeks[wk];
    return `
      <div class="history-item">
        <div class="h-top"><span>${formatWeekRangeNL(wk)}</span><span>${w.hasDuration ? formatDuration(w.duration) : '—'}</span></div>
        <div>${w.count} taken afgevinkt over ${w.days} dag${w.days === 1 ? '' : 'en'}</div>
      </div>`;
  }).join('');
}

function renderHistory(location) {
  const el = document.getElementById(location + '-history');
  const entries = history.filter(h => h.location === location).slice(-8).reverse();
  if (entries.length === 0) { el.innerHTML = '<div class="history-item">Nog geen afmeldingen.</div>'; return; }
  el.innerHTML = entries.map(e => `
    <div class="history-item">
      <div class="h-top"><span>${formatDateNL(e.date)}</span><span>${e.duration ? formatDuration(e.duration) : ''}</span></div>
      <div>${e.count} taken afgevinkt</div>
      ${e.done && e.done.length ? `<ul class="h-done-list">${e.done.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>` : ''}
      ${e.comments ? `<div class="h-comment">"${escapeHtml(e.comments)}"</div>` : ''}
    </div>
  `).join('');
}

function toggleTask(location, id) {
  checkedThisSession[location][id] = document.getElementById(id).checked;
}

async function signOff(location) {
  const commentsInput = document.getElementById(location + '-comments');

  const checkedIds = Object.keys(checkedThisSession[location] || {}).filter(id => checkedThisSession[location][id]);
  if (checkedIds.length === 0) { showToast('Vink minstens één taak aan voordat je aftekent.'); return; }

  // sluit een lopende of gepauzeerde timer af zodat de bestede tijd wordt vastgelegd
  const timerData = await getTimerData(location);
  if (timerData.startedAt || timerData.accumulated > 0) { await stopTimer(location); }
  const duration = finishedDurations[location];

  const tasks = getEffectiveTasks(location);
  const idToText = {};
  tasks.forEach(t => idToText[t.id] = t.text);

  // Eenmalige taken hebben geen terugkerende frequentie/laatst-gedaan -- apart bijhouden
  // zodat ze straks uit de actieve lijst verdwijnen i.p.v. in `state` terecht te komen.
  const onceTasks = getActiveOneTime(location);
  const onceIdSet = new Set(onceTasks.map(t => t.id));
  onceTasks.forEach(t => idToText[t.id] = t.text);

  const today = todayStr();
  const recurringCheckedIds = checkedIds.filter(id => !onceIdSet.has(id));
  recurringCheckedIds.forEach(id => { state[id] = { lastDone: today }; });
  await saveState();

  const doneItems = checkedIds.map(id => idToText[id]).filter(Boolean);
  const comments = commentsInput.value.trim();

  const entry = { location, date: today, duration, comments, count: checkedIds.length, done: doneItems };
  history.push(entry);
  await saveHistory(entry);

  const checkedOnceIds = checkedIds.filter(id => onceIdSet.has(id));
  if (checkedOnceIds.length > 0) {
    saveActiveOneTime(location, onceTasks.filter(t => !checkedOnceIds.includes(t.id)));
  }

  checkedThisSession[location] = {};
  finishedDurations[location] = null;
  showToast('Bedankt! Aftekening opgeslagen.');
  renderView(location);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + '-view').classList.add('active');
  });
});

async function init() {
  document.getElementById('date-label').textContent = new Date().toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  await loadAll();
  renderView('huis');
  renderView('kantoor');
}
init();
</script>
