<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2D2827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kamerpunten">
<title>Kamerpunten</title>
<style>
  :root {
    --brown: #2D2827;
    --pink: #E0A2A2;
    --pink-dark: #c98080;
    --light: #FBF6F6;
    --gray: #8a8382;
    --red: #b5504a;
    --green: #5c9a6e;
    --gold: #c99a3e;
    --border: #e8dede;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: Arial, "Open Sans", sans-serif; background: var(--light); color: var(--brown); padding-bottom: env(safe-area-inset-bottom); }
  header { background: var(--brown); color: var(--light); padding: 18px 16px; }
  header .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  header .titles h1 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; }
  header .titles p { margin: 0; font-size: 13px; color: var(--pink); }
  #sync-status { margin: 2px 0 0 0; font-size: 11px; }

  .wallet-strip { display: flex; gap: 10px; margin-top: 14px; }
  .wallet-card { flex: 1; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; text-align: center; }
  .wallet-card .num { font-size: 20px; font-weight: 700; }
  .wallet-card .lbl { font-size: 10px; color: var(--pink); text-transform: uppercase; letter-spacing: 0.03em; }
  .rank-line { margin-top: 8px; font-size: 12px; color: var(--pink); text-align: center; }

  .tabs { display: flex; background: #fff; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; overflow-x: auto; }
  .tab { flex: 1; padding: 13px 6px; text-align: center; font-weight: 700; font-size: 13px; color: var(--gray); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--brown); border-bottom: 3px solid var(--pink); }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  .view { display: none; }
  .view.active { display: block; }

  .room-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; overflow: hidden; }
  .room-header { padding: 12px 16px; background: #f6ecec; display: flex; justify-content: space-between; align-items: center; }
  .room-header .room-name { font-weight: 700; font-size: 15px; }
  .room-header .room-progress { font-size: 11px; color: var(--gray); }
  .today-task { padding: 16px; }
  .today-task .zone-chip { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; background: var(--pink); color: var(--brown); padding: 2px 8px; border-radius: 8px; margin-bottom: 8px; }
  .today-task .task-text { font-size: 16px; line-height: 1.4; margin-bottom: 12px; }
  .today-task .points-tag { font-size: 12px; color: var(--gold); font-weight: 700; margin-bottom: 12px; }
  .done-btn { width: 100%; padding: 13px; background: var(--brown); color: #fff; border: none; border-radius: 8px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .done-btn:active { background: var(--pink-dark); }
  .done-btn:disabled { background: #ccc; cursor: not-allowed; }
  .today-task.exercise-done { opacity: 0.55; }
  .all-done-msg { padding: 20px 16px; text-align: center; color: var(--green); font-weight: 700; font-size: 14px; }
  .quick-add-row { border-top: 1px solid var(--border); padding: 10px 16px; }
  .quick-add-link { background: none; border: none; color: var(--pink-dark); font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 0; }
  .quick-add-form input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; margin-bottom: 8px; font-family: inherit; }
  .quick-add-form .admin-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .quick-add-form .admin-row > * { flex: 1; }
  .quick-add-submit { background: var(--brown); color: #fff; border: none; border-radius: 6px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .quick-add-cancel { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
  .no-rooms-msg { text-align: center; padding: 40px 16px; color: var(--gray); font-size: 14px; }

  .notif-banner { background: #fff; border: 1px dashed var(--pink-dark); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
  .notif-banner button { margin-top: 8px; background: var(--brown); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }

  .reward-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .reward-card .reward-name { font-size: 14px; font-weight: 700; }
  .reward-card .reward-cost { font-size: 12px; color: var(--gold); font-weight: 700; }
  .reward-card button { background: var(--pink-dark); color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .reward-card button:disabled { background: #ccc; cursor: not-allowed; }

  .history-item { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .history-item .h-top { display: flex; justify-content: space-between; font-weight: 700; }
  .history-item.bonus { border-color: var(--gold); }
  .history-item.redemption { border-color: var(--red); }
  .history-item .h-points { font-weight: 700; }
  .history-item .h-points.neg { color: var(--red); }
  .history-item .h-points.pos { color: var(--green); }

  .admin-section { background: #fff; border-radius: 10px; border: 1px solid var(--border); padding: 14px; margin-bottom: 16px; }
  .admin-section h3 { margin: 0 0 10px 0; font-size: 14px; }
  .admin-section input, .admin-section select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; margin-bottom: 8px; font-family: inherit; }
  .admin-row { display: flex; gap: 8px; }
  .admin-row > * { flex: 1; }
  .admin-add-btn { background: var(--brown); color: #fff; border: none; border-radius: 6px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; }
  .admin-task-row { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .admin-task-row .t-text { flex: 1; }
  .admin-task-row .t-zone { color: var(--gray); font-size: 11px; }
  .admin-task-row .t-points { color: var(--gold); font-weight: 700; font-size: 12px; white-space: nowrap; }
  .admin-task-row button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px; font-size: 12px; cursor: pointer; }
  .admin-task-row .cursor-mark { font-size: 14px; }
  .admin-room-block { border-top: 2px solid var(--border); padding-top: 10px; margin-top: 10px; }
  .admin-room-block:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .admin-room-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .admin-room-title-row .room-title { font-weight: 700; font-size: 14px; }
  .admin-room-title-row button { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
  .inactive-note { color: var(--gray); font-style: italic; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--brown); color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; text-align: center; z-index: 100; }
  .toast.show { opacity: 1; }
  .toast.celebrate { background: var(--green); }

  .confetti-piece { position: fixed; top: -10px; width: 8px; height: 14px; opacity: 0.9; z-index: 200; pointer-events: none; border-radius: 2px; animation: confetti-fall linear forwards; }
  @keyframes confetti-fall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0.2; }
  }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div class="titles">
      <h1>Kamerpunten</h1>
      <p id="date-label">Laden...</p>
      <p id="sync-status"></p>
    </div>
  </div>
  <div class="wallet-strip">
    <div class="wallet-card"><div class="num" id="wallet-balance">0</div><div class="lbl">Punten</div></div>
    <div class="wallet-card"><div class="num" id="wallet-streak">0</div><div class="lbl">Reeks (dagen)</div></div>
    <div class="wallet-card"><div class="num" id="wallet-lifetime">0</div><div class="lbl">Ooit verdiend</div></div>
  </div>
  <div class="rank-line" id="rank-line"></div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="vandaag">Vandaag</div>
  <div class="tab" data-tab="beloningen">Beloningen</div>
  <div class="tab" data-tab="geschiedenis">Geschiedenis</div>
  <div class="tab" data-tab="beheer">Beheer</div>
</div>

<div class="container">
  <div id="vandaag-view" class="view active"><div style="text-align:center;padding:40px;color:#8a8382;">Bezig met laden...</div></div>
  <div id="beloningen-view" class="view"></div>
  <div id="geschiedenis-view" class="view"></div>
  <div id="beheer-view" class="view"></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

<script>
// Zelfde Firebase-project als de schoonmaaklijst-app (mcb-paklijst-2026), maar met
// een eigen pad ("puntenapp") zodat de data volledig gescheiden blijft.
const VAPID_KEY = ""; // vul hier je eigen VAPID-sleutel in (zie README.md) om echte pushmeldingen te activeren

let fbRoot = null;
let messaging = null;
try {
  const firebaseConfig = {
    apiKey: "AIzaSyAvYgPHDIrUUkIPsMfNEWojgzCBO9pfXr8",
    authDomain: "mcb-paklijst-2026.firebaseapp.com",
    databaseURL: "https://mcb-paklijst-2026-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mcb-paklijst-2026",
    storageBucket: "mcb-paklijst-2026.firebasestorage.app",
    messagingSenderId: "373547248244",
    appId: "1:373547248244:web:0f6c930429328f5d98ff21"
  };
  firebase.initializeApp(firebaseConfig);
  fbRoot = firebase.database().ref('puntenapp');
  if (firebase.messaging.isSupported()) {
    messaging = firebase.messaging();
    // Als de app al open staat, toont de browser zelf geen systeemmelding voor een
    // data-only bericht -- laat in dat geval gewoon de gebruikelijke in-app toast zien.
    messaging.onMessage((payload) => {
      const body = (payload.data && payload.data.body) || 'Vandaag staat er weer een taakje klaar.';
      showToast(body);
    });
  }
} catch (e) {
  console.error('Firebase kon niet geladen worden, app werkt alleen lokaal op dit apparaat.', e);
}

function setSyncStatus(text, ok) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = text;
  el.style.color = ok ? '#8fd6ab' : 'var(--pink)';
}

const LS_PREFIX = "kamerpunten_";
function lsGet(key) { try { return localStorage.getItem(LS_PREFIX + key); } catch (e) { return null; } }
function lsSet(key, value) { try { localStorage.setItem(LS_PREFIX + key, value); } catch (e) { console.error(e); } }

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}
function jsStr(str) {
  return String(str == null ? '' : str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}
function localISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function todayStr() { return localISO(new Date()); }
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return localISO(d); }
function formatDateNL(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
}
function newId(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// Standaard startdata -- alleen gebruikt zolang er nog niets in Firebase/localStorage
// staat. Daarna is alles vrij te bewerken via Beheer; deze lijst overschrijft nooit
// bestaande data.
function defaultRooms() {
  const bedTasks = [
    { id: 'sk-bed', text: 'Bed opmaken en kussens opschudden', zone: 'Bed', points: 3, active: true },
    { id: 'sk-nachtkastje', text: 'Nachtkastje leegruimen en afnemen', zone: 'Nachtkastje', points: 5, active: true },
    { id: 'sk-kleren', text: 'Losliggende kleren opruimen of ophangen', zone: 'Vloer', points: 5, active: true },
    { id: 'sk-ladekast', text: 'Stof afnemen op de ladekast', zone: 'Ladekast', points: 5, active: true },
    { id: 'sk-prullenbak', text: 'Prullenbak legen', zone: 'Prullenbak', points: 3, active: true },
    { id: 'sk-vloer', text: 'Een klein stukje vloer stofzuigen of vegen', zone: 'Vloer', points: 8, active: true },
    { id: 'sk-raam', text: 'Vensterbank en kozijn afnemen', zone: 'Raam', points: 5, active: true },
    { id: 'sk-kastplank', text: 'Eén plank in de kast opruimen', zone: 'Kast', points: 10, active: true },
    { id: 'sk-onderbed', text: 'Onder het bed opruimen of stofzuigen', zone: 'Onder bed', points: 10, active: true },
    { id: 'sk-hoeken', text: 'Spinnenwebben en stof in de hoeken wegvegen', zone: 'Hoeken', points: 5, active: true }
  ];
  const zolderTasks = [
    { id: 'zk-doos', text: 'Eén doos of stapel uitzoeken en opruimen', zone: 'Dozen', points: 15, active: true },
    { id: 'zk-vloer', text: 'Een klein stukje vloer vrijmaken en stofzuigen', zone: 'Vloer', points: 10, active: true },
    { id: 'zk-plank', text: 'Eén plank of kastje opruimen', zone: 'Kast', points: 10, active: true },
    { id: 'zk-stof', text: 'Stof afnemen op een oppervlak', zone: 'Oppervlaktes', points: 5, active: true },
    { id: 'zk-kleding', text: 'Klein stapeltje kleding sorteren: bewaren, weggeven of weg', zone: 'Kleding', points: 10, active: true },
    { id: 'zk-hoeken', text: 'Spinnenwebben en stof in de hoeken wegvegen', zone: 'Hoeken', points: 5, active: true },
    { id: 'zk-raam', text: 'Raam en vensterbank afnemen', zone: 'Raam', points: 5, active: true },
    { id: 'zk-spullen', text: 'Losse spullen een vaste plek geven', zone: 'Algemeen', points: 8, active: true }
  ];
  const sportTasks = [
    { id: 'sp-buik', text: 'Buikspieroefening: 1 set (bv. crunches of een plank van 30-60 sec)', zone: 'Buik', points: 8, active: true },
    { id: 'sp-squat', text: 'Squats: 1 set (bv. 15-20 herhalingen)', zone: 'Benen', points: 8, active: true },
    { id: 'sp-lunge', text: 'Lunges: 1 set (bv. 10 per been)', zone: 'Benen', points: 8, active: true }
  ];
  const toMap = (arr) => { const m = {}; arr.forEach(t => { m[t.id] = t; }); return m; };
  return {
    'slaapkamer': { name: 'Slaapkamer', order: 0, active: true, mode: 'rotate', cursor: 0, taskOrder: bedTasks.map(t => t.id), tasks: toMap(bedTasks) },
    'zolderkamer': { name: 'Zolderkamer', order: 1, active: true, mode: 'rotate', cursor: 0, taskOrder: zolderTasks.map(t => t.id), tasks: toMap(zolderTasks) },
    // mode "all" = elke actieve taak staat élke dag klaar (in plaats van roterend één per dag) --
    // past beter bij een vaste, korte sportroutine dan de rotatie-aanpak van de schoonmaakkamers.
    'sport': { name: 'Sport', order: 2, active: true, mode: 'all', cursor: 0, taskOrder: sportTasks.map(t => t.id), tasks: toMap(sportTasks) }
  };
}
function defaultRewards() {
  return {
    'r-boek': { name: 'Nieuw boek (voorbeeld, pas aan!)', cost: 150, archived: false },
    'r-uiteten': { name: 'Avondje uit eten', cost: 400, archived: false },
    'r-vrij': { name: 'Iets leuks voor mezelf (max. €25, vrij te kiezen)', cost: 250, archived: false },
    'r-niksen': { name: 'Middagje niksen zonder schuldgevoel', cost: 100, archived: false }
  };
}

const MILESTONES = { 3: 10, 7: 25, 14: 50, 30: 100, 60: 200, 100: 400 };

const RANKS = [
  { min: 0, label: 'Stofmuis' },
  { min: 50, label: 'Soppenridder' },
  { min: 150, label: 'Vlekkenjager' },
  { min: 300, label: 'Meester Zemer' },
  { min: 600, label: 'Schoonmaak-generaal' },
  { min: 1000, label: 'Huisheld' },
  { min: 2000, label: 'Legende van de Lap' }
];
function rankFor(lifetime) {
  let current = RANKS[0];
  for (const r of RANKS) { if (lifetime >= r.min) current = r; }
  const next = RANKS.find(r => r.min > lifetime);
  return { label: current.label, next };
}

let rooms = {};
let wallet = { balance: 0, lifetime: 0, streak: 0, bestStreak: 0, lastCompletedDate: null };
let rewards = {};
let history = [];
let settings = { reminderHour: 8, reminderMinute: 0 };
let adminMode = true; // geen wachtwoord nodig -- dit is een persoonlijke app voor eigen gebruik
let quickAddOpen = {}; // roomId -> of het snel-toevoegen-formulier op Vandaag openstaat

async function loadAll() {
  try { rooms = JSON.parse(lsGet('rooms') || 'null') || defaultRooms(); } catch (e) { rooms = defaultRooms(); }
  try { wallet = JSON.parse(lsGet('wallet') || 'null') || wallet; } catch (e) {}
  try { rewards = JSON.parse(lsGet('rewards') || 'null') || defaultRewards(); } catch (e) { rewards = defaultRewards(); }
  try { history = JSON.parse(lsGet('history') || '[]'); } catch (e) { history = []; }
  try { settings = JSON.parse(lsGet('settings') || 'null') || settings; } catch (e) {}

  if (ensureSportRoomSeeded()) { lsSet('rooms', JSON.stringify(rooms)); lsSet('settings', JSON.stringify(settings)); }
  renderAll();

  if (!fbRoot) { setSyncStatus('Alleen lokaal (geen Firebase-verbinding)', false); return; }

  firebase.database().ref('.info/connected').on('value', (snap) => {
    setSyncStatus(snap.val() === true ? 'Gesynchroniseerd' : 'Verbinden…', snap.val() === true);
  });

  fbRoot.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      // Eerste keer ooit: er staat nog niets in Firebase -- zet de standaardstartdata weg.
      seedFirebase();
      return;
    }
    rooms = data.rooms || defaultRooms();
    wallet = data.wallet || wallet;
    rewards = data.rewards || defaultRewards();
    history = data.history ? Object.keys(data.history).sort().map(k => data.history[k]) : [];
    settings = data.settings || settings;

    if (ensureSportRoomSeeded()) { saveRooms(); saveSettings(); }

    lsSet('rooms', JSON.stringify(rooms));
    lsSet('wallet', JSON.stringify(wallet));
    lsSet('rewards', JSON.stringify(rewards));
    lsSet('history', JSON.stringify(history));
    lsSet('settings', JSON.stringify(settings));

    renderAll();
  }, (err) => {
    console.error('Firebase-listener fout, val terug op lokale opslag.', err);
    setSyncStatus('Alleen lokaal (verbinding mislukt)', false);
  });
}

function seedFirebase() {
  if (!fbRoot) return;
  settings.sportRoomAdded = true;
  fbRoot.set({ rooms: defaultRooms(), wallet, rewards: defaultRewards(), settings }).catch(e => console.error(e));
}

// Eenmalige migratie voor wie de app al gebruikte vóórdat de Sport-kamer bestond: voegt
// 'm toe aan bestaande data zonder iets anders te overschrijven. settings.sportRoomAdded
// zorgt dat dit maar één keer gebeurt -- verwijder je de Sport-kamer later zelf via
// Beheer, dan komt hij niet steeds terug.
function ensureSportRoomSeeded() {
  if (settings.sportRoomAdded) return false;
  if (!rooms['sport']) { rooms['sport'] = defaultRooms()['sport']; }
  settings.sportRoomAdded = true;
  return true;
}

async function saveRooms() {
  lsSet('rooms', JSON.stringify(rooms));
  if (fbRoot) { try { await fbRoot.child('rooms').set(rooms); } catch (e) { console.error(e); } }
}
async function saveWallet() {
  lsSet('wallet', JSON.stringify(wallet));
  if (fbRoot) { try { await fbRoot.child('wallet').set(wallet); } catch (e) { console.error(e); } }
}
async function saveRewards() {
  lsSet('rewards', JSON.stringify(rewards));
  if (fbRoot) { try { await fbRoot.child('rewards').set(rewards); } catch (e) { console.error(e); } }
}
async function saveSettings() {
  lsSet('settings', JSON.stringify(settings));
  if (fbRoot) { try { await fbRoot.child('settings').set(settings); } catch (e) { console.error(e); } }
}
async function pushHistory(entry) {
  history.push(entry);
  lsSet('history', JSON.stringify(history));
  if (fbRoot) { try { await fbRoot.child('history').push(entry); } catch (e) { console.error(e); } }
}

// Vindt de eerstvolgende actieve taak vanaf `cursor` in de vaste volgorde van de kamer
// (rondlopend), zodat elke taak op den duur een keer aan de beurt komt. Geeft null als
// er geen enkele actieve taak in de kamer is.
function findTodayTask(room) {
  const order = room.taskOrder || [];
  if (order.length === 0) return null;
  for (let i = 0; i < order.length; i++) {
    const idx = (room.cursor + i) % order.length;
    const task = room.tasks[order[idx]];
    if (task && task.active) return { task, idx };
  }
  return null;
}

function renderAll() {
  renderWalletStrip();
  renderVandaag();
  renderBeloningen();
  renderGeschiedenis();
  renderBeheer();
}

// ---- Vandaag: taken afvinken ----
// Verwerkt de puntentelling/streak die voor élke soort taak hetzelfde is (roterende
// schoonmaaktaak of een dagelijkse sportoefening) -- muteert `wallet` maar slaat 'm nog
// niet op, dat doet de aanroeper zelf samen met de rest van zijn wijzigingen.
function awardPointsForToday(points) {
  const today = todayStr();
  let bonus = 0;
  if (wallet.lastCompletedDate !== today) {
    if (wallet.lastCompletedDate === yesterdayStr()) {
      wallet.streak = (wallet.streak || 0) + 1;
    } else {
      wallet.streak = 1;
    }
    wallet.bestStreak = Math.max(wallet.bestStreak || 0, wallet.streak);
    wallet.lastCompletedDate = today;
    if (MILESTONES[wallet.streak]) { bonus = MILESTONES[wallet.streak]; }
  }
  wallet.balance = (wallet.balance || 0) + points + bonus;
  wallet.lifetime = (wallet.lifetime || 0) + points + bonus;
  return bonus;
}

async function completeTask(roomId) {
  const room = rooms[roomId];
  const pick = findTodayTask(room);
  if (!pick) return;

  const points = pick.task.points || 5;
  const today = todayStr();
  const bonus = awardPointsForToday(points);
  room.cursor = (pick.idx + 1) % room.taskOrder.length;

  await saveWallet();
  await saveRooms();
  await pushHistory({ type: 'task', date: today, roomId, roomName: room.name, taskId: pick.task.id, taskText: pick.task.text, points });
  if (bonus > 0) {
    await pushHistory({ type: 'bonus', date: today, streak: wallet.streak, points: bonus });
  }

  renderAll();
  celebrate(bonus > 0 ? '+' + points + ' punten! Én een reeksbonus van +' + bonus + ' 🎉' : '+' + points + ' punten! Goed bezig ✨');
}

// Taken in een "mode: all"-kamer (bv. Sport): elke actieve taak staat elke dag los klaar
// om af te vinken, in plaats van één roterende taak per kamer per dag.
async function completeAllTask(roomId, taskId) {
  const room = rooms[roomId];
  const task = room.tasks[taskId];
  if (!task || task.active === false) return;
  const today = todayStr();
  if (task.lastDoneDate === today) return; // al gedaan vandaag, niets te doen

  const points = task.points || 5;
  const bonus = awardPointsForToday(points);
  task.lastDoneDate = today;

  await saveWallet();
  await saveRooms();
  await pushHistory({ type: 'task', date: today, roomId, roomName: room.name, taskId, taskText: task.text, points });
  if (bonus > 0) {
    await pushHistory({ type: 'bonus', date: today, streak: wallet.streak, points: bonus });
  }

  renderAll();
  celebrate(bonus > 0 ? '+' + points + ' punten! Én een reeksbonus van +' + bonus + ' 🎉' : '+' + points + ' punten! Goed bezig ✨');
}

// ---- Beloningen ----
async function redeemReward(rewardId) {
  const r = rewards[rewardId];
  if (!r) return;
  if ((wallet.balance || 0) < r.cost) { showToast('Nog niet genoeg punten voor deze beloning.'); return; }
  if (!window.confirm('Inwisselen: "' + r.name + '" voor ' + r.cost + ' punten?')) return;
  wallet.balance -= r.cost;
  await saveWallet();
  await pushHistory({ type: 'redemption', date: todayStr(), rewardId, name: r.name, cost: r.cost });
  renderAll();
  showToast('Beloning ingewisseld: ' + r.name + '. Geniet ervan!');
}

async function renameRoom(roomId) {

async function toggleRoomMode(roomId) {

async function deleteRoom(roomId) {

// ---- Taak toevoegen (gedeeld door Vandaag-snelinvoer en Beheer) ----
// idPrefix onderscheidt de twee sets invoervelden in de DOM (Vandaag en Beheer staan
// tegelijk in de pagina, dus de id's mogen niet botsen).
function toggleQuickAdd(roomId) {
  quickAddOpen[roomId] = !quickAddOpen[roomId];
  renderVandaag();
}
async function addTaskFromInputs(roomId, idPrefix) {
  const room = rooms[roomId];
  const textInput = document.getElementById(idPrefix + roomId + '-new-task-text');
  const zoneInput = document.getElementById(idPrefix + roomId + '-new-task-zone');
  const pointsInput = document.getElementById(idPrefix + roomId + '-new-task-points');
  const text = textInput.value.trim();
  if (!text) { showToast('Vul eerst een omschrijving in.'); return; }
  const id = newId('task');
  const points = Math.max(1, parseInt(pointsInput.value, 10) || 5);
  room.tasks[id] = { id, text, zone: zoneInput.value.trim(), points, active: true };
  // Vlak vóór de huidige cursor invoegen, zodat de nieuwe taak meteen "vandaag" aan de
  // beurt is in plaats van pas na de rest van de rij.
  room.taskOrder.splice(room.cursor, 0, id);
  quickAddOpen[roomId] = false;
  await saveRooms();
  renderAll();
  showToast('Taak toegevoegd aan ' + room.name + ' — deze is nu als eerste aan de beurt.');
}
async function editTask(roomId, taskId) {
  const task = rooms[roomId].tasks[taskId];
  const text = window.prompt('Taakomschrijving:', task.text);
  if (text === null) return;
  const trimmed = text.trim();
  if (!trimmed) { showToast('Omschrijving mag niet leeg zijn.'); return; }
  const zone = window.prompt('Plek/zone:', task.zone || '');
  const points = window.prompt('Punten:', task.points);
  task.text = trimmed;
  if (zone !== null) task.zone = zone.trim();
  if (points !== null && !isNaN(parseInt(points, 10))) task.points = Math.max(1, parseInt(points, 10));
  await saveRooms();
  renderAll();
  showToast('Taak aangepast.');
}
async function toggleTaskActive(roomId, taskId) {
  const task = rooms[roomId].tasks[taskId];
  task.active = task.active === false ? true : false;
  await saveRooms();
  renderAll();
}
async function deleteTask(roomId, taskId) {
  const room = rooms[roomId];
  const task = room.tasks[taskId];
  if (!window.confirm('Taak verwijderen: "' + task.text + '"?')) return;
  delete room.tasks[taskId];
  room.taskOrder = room.taskOrder.filter(id => id !== taskId);
  if (room.cursor >= room.taskOrder.length) room.cursor = 0;
  await saveRooms();
  renderAll();
  showToast('Taak verwijderd.');
}
async function moveTaskUp(roomId, taskId) {
  const room = rooms[roomId];
  const idx = room.taskOrder.indexOf(taskId);
  if (idx <= 0) return;
  [room.taskOrder[idx - 1], room.taskOrder[idx]] = [room.taskOrder[idx], room.taskOrder[idx - 1]];
  await saveRooms();
  renderAll();
}
async function moveTaskDown(roomId, taskId) {
  const room = rooms[roomId];
  const idx = room.taskOrder.indexOf(taskId);
  if (idx === -1 || idx >= room.taskOrder.length - 1) return;
  [room.taskOrder[idx + 1], room.taskOrder[idx]] = [room.taskOrder[idx], room.taskOrder[idx + 1]];
  await saveRooms();
  renderAll();
}

// ---- Pushmeldingen ----
async function enableNotifications() {
  if (!messaging) { showToast('Pushmeldingen worden niet ondersteund op dit apparaat/deze browser.'); return; }
  if (!VAPID_KEY) { showToast('VAPID-sleutel ontbreekt nog -- zie README.md.'); return; }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { showToast('Meldingen zijn niet toegestaan.'); return; }
    const reg = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) { showToast('Kon geen meldingstoken ophalen.'); return; }
    const key = token.replace(/[.#$\[\]\/]/g, '_');
    if (fbRoot) { await fbRoot.child('fcmTokens').child(key).set({ token, addedAt: new Date().toISOString() }); }
    showToast('Meldingen staan aan! Je krijgt dagelijks een herinnering.');
    renderAll();
  } catch (e) {
    console.error(e);
    showToast('Meldingen inschakelen is niet gelukt: ' + e.message);
  }
}

function celebrate(msg) {
  showToast(msg, true);
  const colors = ['#E0A2A2', '#c98080', '#c99a3e', '#5c9a6e', '#2D2827'];
  for (let i = 0; i < 24; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3200);
  }
}

function showToast(msg, celebrateStyle) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.toggle('celebrate', !!celebrateStyle);
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + '-view').classList.add('active');
  });
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.error('Service worker registratie mislukt', e));
  });
}

async function init() {
  document.getElementById('date-label').textContent = new Date().toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  await loadAll();
}
init();
</script>
