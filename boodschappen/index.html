<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boodschappen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2D2827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boodschappen">
<style>
  :root { --brown:#2D2827; --pink:#E0A2A2; --pink-dark:#c98080; --light:#FBF6F6; --gray:#8a8382; --red:#b5504a; --green:#4f8a63; --border:#e8dede; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,"Open Sans",sans-serif; background:var(--light); color:var(--brown); }
  header { background:var(--brown); color:var(--light); padding:16px; }
  header h1 { margin:0 0 4px 0; font-size:20px; }
  header p { margin:0; font-size:13px; color:var(--pink); }
  .tabs { display:flex; background:#fff; border-bottom:2px solid var(--border); position:sticky; top:0; z-index:10; }
  .tab { flex:1; padding:13px 4px; text-align:center; font-weight:700; font-size:13px; color:var(--gray); cursor:pointer; border-bottom:3px solid transparent; }
  .tab.active { color:var(--brown); border-bottom-color:var(--pink); }
  .tab .n { background:var(--pink-dark); color:#fff; border-radius:9px; padding:1px 6px; font-size:11px; margin-left:3px; }
  .container { max-width:640px; margin:0 auto; padding:16px; }
  .view { display:none; } .view.active { display:block; }
  .card { background:#fff; border:1px solid var(--border); border-radius:10px; margin-bottom:16px; overflow:hidden; }
  .card h3 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.03em; background:#f6ecec; }
  .row { display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--border); }
  .row .name { flex:1; font-size:14.5px; line-height:1.35; }
  .row .sub { display:block; font-size:11px; color:var(--gray); margin-top:2px; }
  .row.done .name { text-decoration:line-through; color:var(--gray); }
  .row input[type=checkbox] { width:20px; height:20px; accent-color:var(--pink-dark); flex-shrink:0; }
  .qty { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .qty button, .btn-sm { background:#fff; border:1px solid var(--border); border-radius:6px; padding:4px 9px; font-size:14px; cursor:pointer; }
  .qty span { min-width:18px; text-align:center; font-weight:700; }
  a.ah { font-size:12px; color:var(--pink-dark); text-decoration:none; border:1px solid var(--pink); border-radius:6px; padding:4px 7px; flex-shrink:0; }
  button.primary { width:100%; padding:14px; background:var(--brown); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:10px; }
  button.secondary { width:100%; padding:12px; background:#fff; color:var(--brown); border:1px solid var(--brown); border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:10px; }
  .badge { font-size:10px; font-weight:700; color:#fff; padding:2px 6px; border-radius:8px; margin-left:6px; white-space:nowrap; }
  .b-red { background:var(--red); } .b-orange { background:#d08a3c; } .b-gray { background:var(--gray); }
  .note { font-size:13px; color:var(--gray); line-height:1.5; margin:0 0 14px 0; }
  .empty { text-align:center; padding:28px 14px; color:var(--gray); font-size:14px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--brown); color:#fff; padding:12px 18px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:100; }
  .toast.show { opacity:1; }
  input[type=text], input[type=number], textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:14px; }
  .addrow { display:flex; gap:8px; padding:11px 14px; border-top:1px solid var(--border); }
  .addrow button { background:var(--brown); color:#fff; border:none; border-radius:6px; padding:0 14px; font-weight:700; cursor:pointer; }
  .menu { display:flex; flex-wrap:wrap; gap:6px; padding:8px 14px 12px; background:#fbf6f6; border-top:1px dashed var(--border); }
  .ctl { display:flex; align-items:center; gap:10px; margin:0 0 14px 0; font-size:13px; color:var(--gray); flex-wrap:wrap; }
  .ctl select { padding:6px; border:1px solid var(--border); border-radius:6px; font-size:13px; }
  .bar { height:10px; background:var(--pink-dark); border-radius:5px; }
  .totals { display:flex; justify-content:space-between; padding:12px 14px; border-top:1px solid var(--border); font-weight:700; font-size:14px; }
</style>
</head>
<body>

<header>
  <h1>Boodschappen</h1>
  <p id="next-delivery">Laden...</p>
</header>

<div class="tabs">
  <div class="tab active" data-tab="order">Bestelling<span class="n" id="n-order"></span></div>
  <div class="tab" data-tab="suggest">Waarschijnlijk op<span class="n" id="n-suggest"></span></div>
  <div class="tab" data-tab="standard">Standaard</div>
  <div class="tab" data-tab="data">Data</div>
</div>

<div class="container">
  <div id="order-view" class="view active"><div id="order-top"></div><div id="order-list"></div></div>
  <div id="suggest-view" class="view"></div>
  <div id="standard-view" class="view"></div>
  <div id="data-view" class="view"></div>
</div>
<div id="toast" class="toast"></div>

<script>
// Alle gegevens blijven in de browser (localStorage). De bestelgeschiedenis staat
// bewust NIET in deze repo (publiek): importeer hem via tabblad "Data".
const VERSION = '2026-10-18h';
const KEY = 'ahb_v1';
const UI = { open: { 'Vaker gekocht': false, 'Soms gekocht': false }, q: '', byDept: false, menu: null };
const DAY = 86400000;

// Producten die je niet elke week koopt maar waar je wel voor wilt waarschuwen,
// ook als er (nog) maar één aankoop bekend is. Interval = geschatte dagen per aankoop.
const DEFAULT_INTERVALS = [
  { re: /toiletpapier/i, days: 30, label: 'wc-papier' },
  { re: /^o\.b\.|tampon/i, days: 30, label: 'tampons' },
  { re: /vaatwastablet/i, days: 45, label: 'vaatwastabletten' },
  { re: /halvarine|margarine|roomboter(?!\s*stroop)|^(AH )?boter\b/i, days: 35, label: 'boter/halvarine' },
  { re: /batterij/i, days: 180, label: 'batterijen' },
  { re: /tandpasta/i, days: 45, label: 'tandpasta' },
  { re: /shampoo/i, days: 35, label: 'shampoo' },
  { re: /deodorant/i, days: 45, label: 'deodorant' },
  { re: /afwasmiddel/i, days: 60, label: 'afwasmiddel' }
];

let S = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && s.orders) return Object.assign({ cfg: {}, current: {} }, s);
  } catch (e) {}
  return { orders: [], cfg: {}, current: {} };
}
function save(opts) {
  const remote = opts && opts.remote;
  if (!remote) S.t = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Opslaan lukt niet in deze browser'); }
  if (!remote && typeof syncSchedule === 'function') syncSchedule();
}
function cfg() {
  const c = S.cfg;
  c.removed = c.removed || []; c.extra = c.extra || []; c.qty = c.qty || {};
  c.ignored = c.ignored || []; c.minShare = c.minShare || 0.5;
  return c;
}
function cur() {
  if (!S.current || S.current.week !== nextDelivery()) S.current = { week: nextDelivery() };
  const c = S.current;
  c.sel = c.sel || {}; c.adds = c.adds || {}; c.qty = c.qty || {};
  return c;
}

function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  setTimeout(function () { el.classList.remove('show'); }, 2200);
}
function h(tag, attrs, kids) {
  const el = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'text') el.textContent = attrs[k];
    else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}

// ---------- datum helpers ----------
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parse(s) { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / DAY); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
function today() { return iso(new Date()); }
// Eerstvolgende bezorgdag = dinsdag na vandaag; wijzigen kan tot maandag 23:59.
function nextDelivery() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  do { d.setDate(d.getDate() + 1); } while (d.getDay() !== 2);
  return iso(d);
}
const FMT = new Intl.DateTimeFormat('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
function nice(s) { return FMT.format(parse(s)); }
function eur(n) { return '€ ' + n.toFixed(2).replace('.', ','); }

// ---------- analyse ----------
function orderHistory() {
  return S.orders.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}
function productStats() {
  const map = {};
  orderHistory().forEach(function (o, idx) {
    const seen = {};
    o.items.forEach(function (it) {
      const p = map[it.name] || (map[it.name] = { name: it.name, events: [], price: 0, idxs: [] });
      if (seen[it.name]) { seen[it.name].qty += it.qty; return; }
      const ev = { date: o.date, qty: it.qty, idx: idx };
      seen[it.name] = ev; p.events.push(ev); p.idxs.push(idx);
      p.price = it.price || p.price;
    });
  });
  return map;
}
function median(a) { const s = a.slice().sort(function (x, y) { return x - y; }); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2); }

function standardItems() {
  const hist = orderHistory(); const stats = productStats();
  const window_ = 12; const n = hist.length; if (!n) return [];
  const from = Math.max(0, n - window_); const span = n - from;
  const out = [];
  Object.keys(stats).forEach(function (name) {
    const p = stats[name];
    const recent = p.events.filter(function (e) { return e.idx >= from; });
    const share = recent.length / span;
    const lastIdx = p.idxs[p.idxs.length - 1];
    if (share >= cfg().minShare && n - 1 - lastIdx <= 2) {
      out.push({ name: name, qty: cfg().qty[name] || median(recent.map(function (e) { return e.qty; })), price: p.price, share: share, auto: true });
    }
  });
  cfg().extra.forEach(function (x) { if (!out.some(function (o) { return o.name === x.name; })) out.push({ name: x.name, qty: cfg().qty[x.name] || x.qty, price: (stats[x.name] || {}).price || 0, share: 0, auto: false }); });
  return out.filter(function (o) { return cfg().removed.indexOf(o.name) < 0; })
    .sort(function (a, b) { return b.share - a.share || (a.name < b.name ? -1 : 1); });
}

// Aankopen per product, maar huishoudcategorieen (bv. alle halvarine-merken) samengenomen.
function groupedStats() {
  const groups = {};
  orderHistory().forEach(function (o) {
    const perGroup = {};
    o.items.forEach(function (it) {
      const cat = defaultFor(it.name);
      const key = cat ? 'cat:' + cat.label : it.name;
      const g = perGroup[key] || (perGroup[key] = { key: key, qty: 0, name: it.name, price: it.price, cat: cat });
      g.qty += it.qty; g.name = it.name; g.price = it.price || g.price;
    });
    Object.keys(perGroup).forEach(function (k) {
      const g = perGroup[k];
      const t = groups[k] || (groups[k] = { key: k, cat: g.cat, events: [], name: g.name, price: g.price });
      t.events.push({ date: o.date, qty: g.qty }); t.name = g.name; t.price = g.price || t.price;
    });
  });
  return groups;
}

function suggestions() {
  const hist = orderHistory(); if (!hist.length) return [];
  const groups = groupedStats(); const T = nextDelivery();
  const std = {}; standardItems().forEach(function (s) { std[s.name] = 1; });
  const out = [];
  Object.keys(groups).forEach(function (key) {
    const g = groups[key]; const name = g.name;
    if (std[name] || cfg().ignored.indexOf(key) >= 0 || cfg().ignored.indexOf(name) >= 0) return;
    const ev = g.events; const last = ev[ev.length - 1];
    let perUnitDays = null, basis = '', conf = 0;
    if (ev.length >= 3) {
      const span = daysBetween(ev[0].date, last.date);
      const units = ev.slice(0, -1).reduce(function (s, e) { return s + e.qty; }, 0);
      if (span > 0 && units > 0) { perUnitDays = span / units; basis = 'gemiddeld 1 aankoop per ' + Math.round(perUnitDays * last.qty) + ' dagen (' + ev.length + ' keer gekocht)'; conf = ev.length; }
    }
    if (perUnitDays === null) {
      if (!g.cat) return; // zonder vaste categorie en met < 3 aankopen geen voorspelling
      perUnitDays = g.cat.days / Math.max(1, last.qty); basis = 'schatting (te weinig historie): ' + g.cat.label + ' ± ' + g.cat.days + ' dagen per verpakking';
    }
    const total = Math.round(perUnitDays * last.qty);
    if (!g.cat && total > 90) return; // te zeldzaam om op te attenderen
    const runout = stockOverride(key, last.date, addDays(last.date, total));
    const left = daysBetween(T, runout); // dagen na de bezorging dat het naar verwachting op is
    if (g.cat) {
      if (left > 14) return; // nog genoeg voorraad
      if (left < -Math.max(14, Math.round(total * 0.75))) return; // allang voorbij: waarschijnlijk elders gekocht
    } else {
      // gewone producten: bij voldoende historie en als het rond de volgende bezorging op moet zijn
      if (ev.length < 4 || left > 14 || left < -14) return;
    }
    out.push({ key: key, name: name, qty: cfg().qty[name] || median(ev.map(function (e) { return e.qty; })), price: g.price, runout: runout, left: left, basis: basis, conf: conf, last: last.date });
  });
  return out.sort(function (a, b) { return a.left - b.left; });
}
// Overzicht van alle huishoudcategorieen met verwachte "op"-datum, ook als ze nog niet aan de beurt zijn.
function householdOverview() {
  const groups = groupedStats(); const out = []; const T = nextDelivery();
  Object.keys(groups).forEach(function (key) {
    const g = groups[key]; if (!g.cat) return;
    const ev = g.events; const last = ev[ev.length - 1]; let perUnit;
    if (ev.length >= 3) { const units = ev.slice(0, -1).reduce(function (s, e) { return s + e.qty; }, 0); const span = daysBetween(ev[0].date, last.date); perUnit = units > 0 && span > 0 ? span / units : g.cat.days; }
    else perUnit = g.cat.days / Math.max(1, last.qty);
    const runout = stockOverride(key, last.date, addDays(last.date, Math.round(perUnit * last.qty)));
    if (daysBetween(runout, today()) > 45) return; // al maanden niet meer gekocht: waarschijnlijk elders
    out.push({ key: key, label: g.cat.label, name: g.name, qty: median(ev.map(function (e) { return e.qty; })), price: g.price, runout: runout, left: daysBetween(T, runout), last: last.date, est: ev.length < 3, n: ev.length });
  });
  return out.sort(function (a, b) { return a.runout < b.runout ? -1 : 1; });
}
// "Heb ik nog / elders gekocht": handmatig ingestelde voorraad gaat voor, tot er weer bij AH gekocht is.
function stockOverride(key, lastDate, runout) {
  const st = (cfg().stock || {})[key];
  return st && st.set >= lastDate ? st.until : runout;
}
function stockPrompt(key, name) {
  const v = prompt('Hoeveel weken gaat "' + name + '" nog mee? (0 = op, leeg laten = automatisch)', '');
  if (v === null) return;
  const c = cfg(); c.stock = c.stock || {};
  if (!v.trim()) delete c.stock[key];
  else { const w = parseFloat(v.replace(',', '.')); if (isNaN(w) || w < 0) return toast('Geen geldig aantal weken'); c.stock[key] = { set: today(), until: addDays(today(), Math.round(w * 7)) }; }
  save(); render(); toast('Voorraad bijgewerkt');
}

// Afdelingen, in looproute-volgorde; de eerste regex die past wint.
const DEPT_ORDER = ['Groente & fruit', 'Brood & ontbijt', 'Zuivel & eieren', 'Vlees & beleg', 'Houdbaar & kruiden', 'Diepvries', 'Snacks & zoet', 'Drank', 'Huishoudelijk', 'Overig'];
const DEPT_RE = [
  ['Huishoudelijk', /toiletpapier|^o\.b\.|tampon|vaatwas|afwas|batterij|shampoo|conditioner|andrélon|sanex|nivea|make-up|tandpasta|deodorant|zeep|keukenrol|zakjes|wasmiddel|neusspray|hondenbrokken/i],
  ['Drank', /bier|weizen|radler|cola\b|fanta|sprite|ice tea|lipton|wijn|chardonnay|seltzer|stëlz|stelz|frisss|chouffe|cider|cassis|siroop|koffie|thee\b|\bsap\b|tripel|abdij/i],
  ['Diepvries', /gyoza|pizza|kroket|aardappelbol|pom'|frites|diepvries|\bijs\b|mini aardappel/i],
  ['Snacks & zoet', /chips|lay's|doritos|bugles|knaks|maiswafel|koek|chocola|snoep|red band|drop\b|noten|popcorn|kroepoek|nacho|stroopwafel|galettes|luikse|vlokfeest|vlokken|hagelslag|maoam|bloxx|haribo|amandel/i],
  ['Zuivel & eieren', /melk|kaas|yoghurt|kwark|eieren|\bei\b|\bboter\b|paturain|geraspt|goudse|belegen|plakken|halvarine|roomboter|crème|creme|sour cream|mozzarella|feta|philadelphia|parmigiano|pecorino|goudkuipje|skyr|\bvla\b|geitenkaas|apetina|mascarpone|soja|plantaardig|grana/i],
  ['Houdbaar & kruiden', /pasta|rijst|saus|ketchup|mayo|azijn|olie\b|bouillon|soep|noedels|\bmie\b|linguine|fusilli|seasoning|verstegen|santa maria|remia|honig|passata|tomatenpuree|bonen|maiskorrels|salsa|guacamole|dip mix|pesto|kruidenmix|pindakaas|mora|basilicum|tijm|oregano|rozemarijn|koriander|euroma|picadillo|augurk|zuurkool|salade/i],
  ['Brood & ontbijt', /brood|zaans|spelt|pistolet|\bbol\b|wrap|tortilla|cracotte|beschuit|croissant|jam\b|muesli|havermout|bladerdeeg|broodje/i],
  ['Vlees & beleg', /kip|rund|gehakt|worst|americain|spek|\bham\b|chorizo|guanciale|burger|braad|schnitzel|vis\b|zalm|tonijn|mergpijp|beleg|shoarma/i],
  ['Groente & fruit', /komkommer|tomaat|tomaten|paprika|courgette|banaan|bananen|appel|peer\b|avocado|sla\b|rucola|elstar|italiaanse mix|bosui|\bui\b|uien|knoflook|champignon|aardappel|boerenkool|spinazie|wortel|citroen|limoen|bessen|groente|fruit|sperziebonen|broccoli|bloemkool|druif/i]
];
function deptOf(name) { for (let i = 0; i < DEPT_RE.length; i++) if (DEPT_RE[i][1].test(name)) return DEPT_RE[i][0]; return 'Overig'; }
function deptIndex(name) { return DEPT_ORDER.indexOf(deptOf(name)); }

// Producten die vaak samen in dezelfde bestelling zitten, bv. alles voor taco's.
function coSets() {
  const hist = orderHistory(); const idx = {};
  hist.forEach(function (o, i) { const seen = {}; o.items.forEach(function (it) { if (seen[it.name]) return; seen[it.name] = 1; (idx[it.name] = idx[it.name] || []).push(i); }); });
  const names = Object.keys(idx).filter(function (n) { return idx[n].length >= 5 && !defaultFor(n) && cfg().ignored.indexOf(n) < 0; });
  const par = {}; names.forEach(function (n) { par[n] = n; });
  function find(x) { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; }
  for (let i = 0; i < names.length; i++) {
    const A = new Set(idx[names[i]]);
    for (let j = i + 1; j < names.length; j++) {
      let co = 0; idx[names[j]].forEach(function (k) { if (A.has(k)) co++; });
      if (co >= 4 && co / (A.size + idx[names[j]].length - co) >= 0.6) par[find(names[i])] = find(names[j]);
    }
  }
  const comps = {}; names.forEach(function (n) { (comps[find(n)] = comps[find(n)] || []).push(n); });
  return Object.keys(comps).map(function (k) { return comps[k]; }).filter(function (m) { return m.length >= 2 && m.length <= 5; })
    .map(function (m) { m.sort(function (a, b) { return idx[b].length - idx[a].length; }); return { members: m, n: idx[m[0]].length, label: m[0].replace(/^AH /, '') + ' + ' + (m.length - 1) + ' meer' }; })
    .sort(function (a, b) { return b.n - a.n; }).slice(0, 6);
}

function defaultFor(name) { return DEFAULT_INTERVALS.filter(function (d) { return d.re.test(name); })[0]; }

// ---------- huidige bestelling ----------
// Eén lijst met alles wat je kunt bestellen. Standaard en wat (bijna) op is staan aangevinkt;
// de rest staat klaar om aan te vinken. Zoeken laat ook alles zien wat ooit gekocht is.
const GROUPS = ['Standaard', 'Waarschijnlijk op', 'Huishoudelijk', 'Vaker gekocht', 'Soms gekocht', 'Overige resultaten', 'Extra'];
function proposalLines(query) {
  const c = cur(); const lines = []; const have = {};
  function push(l) {
    if (have[l.name]) return; have[l.name] = 1;
    l.checked = c.sel[l.name] !== undefined ? c.sel[l.name] : l.def;
    l.qty = c.qty[l.name] || l.qty;
    lines.push(l);
  }
  const stats = productStats();
  standardItems().forEach(function (x) { push({ name: x.name, qty: x.qty, price: x.price, group: 'Standaard', def: true, reason: '' }); });
  householdOverview().forEach(function (o) {

// ---------- Gmail-koppeling ----------
// De app leest zelf de AH-bevestigingsmails (alleen-lezen) via de Gmail-API. Het
// OAuth client-ID staat in localStorage van deze browser, niet in de repo.
const GM_KEY = 'ahb_gmail_client';
const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function gmClient() { try { return localStorage.getItem(GM_KEY) || ''; } catch (e) { return ''; } }
function b64u(str) {
  const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  return new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.charCodeAt(0); }));
}
function num(t) { return parseFloat(String(t).replace(',', '.')); }
function subjectDate(subject) {
  const m = new RegExp('(\\d{1,2})\\s+(' + MONTHS.join('|') + ')\\s+(\\d{4})', 'i').exec(subject || '');
  if (!m) return null;
  return m[3] + '-' + String(MONTHS.indexOf(m[2].toLowerCase()) + 1).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0');
}
// Productrijen staan in <tr> met precies 4 <td>: naam | aantal | prijs | totaal.
// Sectierijen ("Albert Heijn", "Gratis toegevoegd") hebben lege cellen; gratis items slaan we over.
function parseOrderHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const items = []; let total = null, free = false;
  Array.prototype.forEach.call(doc.querySelectorAll('tr'), function (tr) {
    if (tr.querySelector('tr')) return;
    const cells = Array.prototype.filter.call(tr.children, function (c) { return c.tagName === 'TD'; });
    if (cells.length !== 4) return;
    const t = cells.map(function (c) { return c.textContent.replace(/[\s ]+/g, ' ').trim(); });
    if (/^Gratis toegevoegd/i.test(t[0]) && !t[1]) { free = true; return; }
    if (/^Boodschappen totaal/i.test(t[0])) { total = num(t[3]); return; }
    if (!t[1] && !t[2]) { if (t[0]) free = false; return; }
    if (!/^\d+$/.test(t[1]) || !/^\d+[.,]\d{2}$/.test(t[2])) return;
    const price = num(t[2]);
    if (free || price === 0) return;
    items.push({ name: t[0], qty: parseInt(t[1], 10), price: price });
  });
  const sum = items.reduce(function (a, i) { return a + i.qty * i.price; }, 0);
  return { items: items, total: total, sum: Math.round(sum * 100) / 100 };
}
function findBody(part, out) {
  out = out || { html: '', text: '' };
  if (!part) return out;
  if (part.body && part.body.data) {
    if (part.mimeType === 'text/html' && !out.html) out.html = b64u(part.body.data);
    else if (part.mimeType === 'text/plain' && !out.text) out.text = b64u(part.body.data);
  }
  (part.parts || []).forEach(function (p) { findBody(p, out); });
  return out;
}
function gmToken(clientId) {
  return new Promise(function (resolve, reject) {
    function go() {
      try {
        google.accounts.oauth2.initTokenClient({
          client_id: clientId, scope: 'https://www.googleapis.com/auth/gmail.readonly',
          callback: function (r) { if (r.error || !r.access_token) reject(new Error(r.error_description || r.error || 'geen toegang')); else resolve(r.access_token); },
          error_callback: function (e) { reject(new Error(e.type || 'inloggen geannuleerd')); }
        }).requestAccessToken();
      } catch (e) { reject(e); }
    }
    if (window.google && google.accounts && google.accounts.oauth2) return go();
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client';
    sc.onload = go; sc.onerror = function () { reject(new Error('Google-inlogscript niet bereikbaar')); };
    document.head.appendChild(sc);
  });
}
function gmGet(path, token) {
  return fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, { headers: { Authorization: 'Bearer ' + token } }).then(function (r) {
    if (!r.ok) throw new Error('Gmail antwoordde ' + r.status);
    return r.json();
  });
}
function gmStatus(t) { const el = document.getElementById('gmail-status'); if (el) el.textContent = t; }

async function gmailSync(days) {
  const clientId = gmClient();
  if (!clientId) { toast('Vul eerst je Google client-ID in (tabblad Data)'); return; }
  gmStatus('Inloggen bij Google…');
  try {
    const token = await gmToken(clientId);
    gmStatus('Bevestigingsmails zoeken…');
    const q = 'from:bestellingen@ah.nl subject:"Bedankt voor jouw bestelling" newer_than:' + days + 'd';
    let ids = [], page = '';
    do {
      const r = await gmGet('messages?maxResults=100&q=' + encodeURIComponent(q) + (page ? '&pageToken=' + page : ''), token);
      ids = ids.concat((r.messages || []).map(function (m) { return m.id; })); page = r.nextPageToken || '';
    } while (page);
    if (!ids.length) { gmStatus('Geen bevestigingsmails gevonden in de laatste ' + days + ' dagen.'); return; }
    const best = {}; const t0 = today();
    for (let i = 0; i < ids.length; i += 5) {
      gmStatus('Mails lezen… ' + Math.min(i + 5, ids.length) + '/' + ids.length);
      const batch = await Promise.all(ids.slice(i, i + 5).map(function (id) { return gmGet('messages/' + id + '?format=full', token); }));
      batch.forEach(function (m) {
        const subj = ((m.payload.headers || []).filter(function (h2) { return h2.name.toLowerCase() === 'subject'; })[0] || {}).value;
        const date = subjectDate(subj);
        if (!date || date > t0) return; // toekomstige bezorgdata zijn nog wijzigbaar
        const ts = +m.internalDate || 0;
        if (!best[date] || ts > best[date].ts) best[date] = { ts: ts, payload: m.payload };
      });
    }
    const added = []; const warn = [];
    Object.keys(best).sort().forEach(function (date) {
      const body = findBody(best[date].payload);
      const r = body.html ? parseOrderHtml(body.html) : { items: [], total: null, sum: 0 };
      if (!r.items.length) { warn.push(date + ': geen producten gevonden'); return; }
      if (r.total !== null && Math.abs(r.total - r.sum) > 0.02) warn.push(date + ': som ' + eur(r.sum) + ' wijkt af van mail ' + eur(r.total));
      added.push({ date: date, items: r.items });
    });
    if (added.length) {
      const byDate = {}; S.orders.forEach(function (o) { byDate[o.date] = o; });
      added.forEach(function (o) { byDate[o.date] = o; });
      S.orders = Object.keys(byDate).map(function (k) { return byDate[k]; });
      save(); render();
    }
    gmStatus(added.length + ' bestelling(en) bijgewerkt' + (added.length ? ' (t/m ' + added[added.length - 1].date + ')' : '') + (warn.length ? '. Let op: ' + warn.join('; ') : '.'));
    toast(added.length + ' bestelling(en) opgehaald');
  } catch (e) { gmStatus('Mislukt: ' + e.message); toast('Gmail ophalen mislukt'); }
}
